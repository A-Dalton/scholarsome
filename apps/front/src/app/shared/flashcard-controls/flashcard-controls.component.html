<div class="card text-center shadow-sm">
  <div class="card-body">
    <div class="d-flex gap-2">
      @for (action of actions(); track $index) {
        <button
          type="button"
          #actionButton
          class="rating-button btn fw-bold"
          [ngClass]="action.variant"
          [disabled]="action.disabled ?? false"
          [scholarsomeHoverGuard]="action.disabled ?? false"
          (click)="flash($event); action.action()"
          [attr.aria-label]="action.ariaLabel ?? action.label"
        >
          @if (action.icon) {
            <fa-icon [icon]="action.icon"></fa-icon>
          }
          @if (action.label) {
            <span class="rating-label">{{ action.label }}</span>
          }
          @if (action.key) {
            <kbd aria-hidden="true">{{ action.key }}</kbd>
          }
        </button>
      }
    </div>

    <div class="session-progress mt-3">
      <div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" [attr.aria-valuemax]="barTotal() ?? total()" [attr.aria-valuenow]="barValue()">
        <div class="progress-bar" [style.width.%]="barPercent()"></div>
      </div>
      <p class="text-secondary mb-0 mt-2">{{ counterText() }}</p>
    </div>
  </div>
</div>
