name: Run tests
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.JS
        uses: actions/setup-node@v3
        with:
          node-version: '26'

      - name: Install dependencies and generate Prisma types
        run: |
          npm install --legacy-peer-deps
          npm run generate

      - name: Build and lint
        run: |
          npm run build
          npm run lint

      - name: Run tests
        run: npm run test

