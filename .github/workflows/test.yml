name: Run tests
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires DATABASE_URL to be resolvable, but "prisma
      # generate" never connects to a database, so a placeholder is
      # sufficient. The tests mock PrismaService and do not use a real
      # database either.
      DATABASE_URL: mysql://scholarsome:scholarsome@localhost:3306/scholarsome
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nx validates cache entries by hashing all task inputs, so restoring
      # a stale cache entry can only ever result in a rebuild, never an
      # incorrect build artifact.
      - name: Cache Nx tasks
        uses: actions/cache@v4
        with:
          path: .nx
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Generate Prisma types
        run: npm run generate

      - name: Build and lint
        run: |
          npm run build
          npm run lint

      - name: Run tests
        run: npm run test
