name: Build and push image
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tags
        id: image-tags
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/scholarsome
          GIT_TAG: ${{ github.ref_name }}
        run: |
          # Per semver, a pre-release identifier (alpha, beta) follows the
          # version number after a dash. Pre-release builds must not
          # overwrite the latest tag on Docker Hub.
          if printf '%s' "$GIT_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)'; then
            echo "tags=$IMAGE:$GIT_TAG" >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<TAGS"
              echo "$IMAGE:latest"
              echo "$IMAGE:$GIT_TAG"
              echo "TAGS"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Docker Hub consumers on older Docker versions can trip over
          # attestation manifests, so they are disabled for this image.
          provenance: false
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
