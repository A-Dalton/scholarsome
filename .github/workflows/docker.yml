name: Build and push image
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Docker Hub consumers on older Docker versions can trip over
          # attestation manifests, so they are disabled for this image.
          provenance: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/scholarsome:latest
            ${{ secrets.DOCKER_USERNAME }}/scholarsome:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
